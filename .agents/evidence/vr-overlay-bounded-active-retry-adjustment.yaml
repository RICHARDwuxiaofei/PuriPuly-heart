schema_version: 1
decision:
  authority: user
  status: approved
  summary: Remove same-episode quiet postponement while retaining P05 and all bounded retry contracts.
  retained_contracts:
    - Immediate normal submission for each accepted update.
    - P05 uses a 100 ms cadence and a 500 ms scheduling wall.
    - One stream episode has at most four completed retry opportunities.
    - One final episode has at most five completed retry opportunities.
    - Generation replacement does not replenish the episode budget or deadline.
    - SELF and PEER due work remains physically coalesced.
    - Capability, target identity, lifecycle ownership, cancellation, and shutdown contracts remain unchanged.
  changed_contracts:
    - Same-episode generation replacement preserves next_due instead of rebasing it to update time plus 100 ms.
    - A retry preempted by a newer same-target, same-episode generation remains due; the latest causally covered snapshot submission satisfies the transferred due intent without a second physical submit.

implementation:
  boundary: native lifecycle owner and runtime retry scheduling
  files:
    - native/overlay/src/runtime.rs
    - native/overlay/src/renderer/backend.rs
    - native/overlay/tests/runtime.rs
  regression_tests:
    - runtime::tests::stream_generation_replacement_preserves_due_and_budget_while_final_resets
    - production_owner_preemption_preserves_due_and_completes_on_pending_snapshot

