ownership_contract:
  confirmed_native: strict current-process capability version 1 with exclusive ownership disables Python bursts and enables exact Native trigger emission
  conservative_fallback: missing, malformed, unsupported, failed, stopped, restarted, or reattached Native retains or restores Python ownership
  transition: event ingress is serialized; Native terminates before active-runtime fallback restarts; closing runtimes create no fallback tasks
  compatibility: optional ready and snapshot fields preserve old startup and protocol behavior
target_contract:
  identity: exact runtime-only target identity is emitted only after Native ownership confirmation
  cleanup: replacement, loss, hide, expiry, clipping, absence, failure, disconnect, and shutdown terminate applicable work
  isolation: unrelated same-channel content cannot sustain or inherit an exact target intent
  diagnostics: raw target identity and caption content are excluded
dd_002:
  decision: accepted
  stream_episode:
    logical_opportunity_budget: 4
    scope: per channel and visible target episode across successive stream generations
    replacement: causally current generation changes do not replenish the episode budget
    consumption: a due opportunity satisfied by retry, compatible coalesced work, or a qualifying normal submission consumes one logical opportunity
    immediate_submission: a normal submission before the 100 ms quiet interval does not consume retry budget
    termination: target loss, hide, expiry, clipping, absence, failure, disconnect, or shutdown ends the episode
  final_episode:
    profile_max_logical_opportunities:
      P05: 5
      P10: 10
      P15: 15
      P20: 20
    cadence_ms: 100
    semantics: SELF TranscriptFinal starts final coverage; SELF Translation replaces it with a new SELF final episode; PEER final replaces its stream episode with a final episode
    coalescing: one compatible physical attempt can consume one included opportunity from each logical episode
  rationale: Phase-1 rapid sequences completed one opportunity for each of four intermediate generations, while settled P20 finals completed 18 actual attempts under the max-20 two-second wall; the decision preserves measured stream coverage, bounds arbitrarily long streams, and reserves independent final coverage
  claim_boundary: maxima are scheduling budgets; actual completed physical and logical attempts remain measured evidence
route:
  decision: advance
  next_action: implement bounded quiet-tail profiles without selecting a product profile
limitations:
  - This gate did not implement quiet-tail scheduling or select P05, P10, P15, or P20.
  - Phase-1 physical evidence remains bounded to SteamVR Home on the recorded affected-HMD environment.
